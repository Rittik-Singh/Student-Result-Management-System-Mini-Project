# Database Configuration for Student Result Management System
# Supports MySQL (Default) with auto-fallback to embedded H2 if MySQL is offline

db.type=mysql
db.host=localhost
db.port=3306
db.name=srms_db
db.username=root
db.password=
db.autoCreateDatabase=true
db.fallback.h2=true
db.h2.path=./data/srms_db
